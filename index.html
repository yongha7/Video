<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>내 영상 플레이어</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.player{
    position:relative;
    width:100%;
    max-width:1100px;
    background:#000;
    overflow:hidden;
}

video{
    display:block;
    width:100%;
    max-height:100vh;
    background:#000;
}

.controls{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:10px;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.9)
    );
    transition:.25s;
}

.player.hide-controls .controls{
    opacity:0;
    pointer-events:none;
}

.progress{
    width:100%;
    margin-bottom:8px;
}

.buttons{
    display:flex;
    align-items:center;
    gap:7px;
    flex-wrap:wrap;
}

button,select{
    border:0;
    border-radius:7px;
    background:rgba(255,255,255,.14);
    color:#fff;
    padding:7px 10px;
    cursor:pointer;
}

button:hover,
select:hover{
    background:rgba(255,255,255,.25);
}

select option{
    color:#000;
}

.time{
    font-size:13px;
    margin-left:auto;
}

.volume{
    width:80px;
}

.title{
    position:absolute;
    top:12px;
    left:14px;
    font-size:14px;
    opacity:.85;
    text-shadow:0 1px 4px #000;
}

.menu{
    position:absolute;
    right:10px;
    bottom:55px;
    display:none;
    width:180px;
    padding:8px;
    background:rgba(20,20,20,.96);
    border-radius:10px;
    box-shadow:0 4px 20px #000;
}

.menu.show{
    display:block;
}

.menu button{
    width:100%;
    text-align:left;
    margin:2px 0;
}

@media(max-width:600px){
    .controls{
        padding:7px;
    }

    button,select{
        padding:6px 8px;
        font-size:12px;
    }

    .volume{
        width:55px;
    }

    .time{
        font-size:11px;
    }
}
</style>
</head>

<body>

<div class="player" id="player">

    <div class="title">
        내 영상
    </div>

    <video
        id="video"
        playsinline
        preload="metadata"
        controlslist="nodownload"
    >
        <source
            src="artplayer.org_compressed_1792410972266.mp4"
            type="video/mp4">
        브라우저가 영상을 재생할 수 없습니다.
    </video>

    <div class="controls">

        <input
            id="progress"
            class="progress"
            type="range"
            min="0"
            max="100"
            value="0">

        <div class="buttons">

            <button id="play">▶</button>

            <button id="back">↶ 10초</button>

            <button id="forward">10초 ↷</button>

            <button id="mute">🔊</button>

            <input
                id="volume"
                class="volume"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="1">

            <span class="time" id="time">
                00:00 / 00:00
            </span>

            <select id="speed">
                <option value="0.25">0.25×</option>
                <option value="0.5">0.5×</option>
                <option value="0.75">0.75×</option>
                <option value="1" selected>1×</option>
                <option value="1.25">1.25×</option>
                <option value="1.5">1.5×</option>
                <option value="1.75">1.75×</option>
                <option value="2">2×</option>
                <option value="2.5">2.5×</option>
                <option value="3">3×</option>
                <option value="4">4×</option>
            </select>

            <button id="pip">PiP</button>

            <button id="fullscreen">⛶</button>

            <button id="more">⚙</button>

        </div>
    </div>

    <div class="menu" id="menu">

        <button id="quality">
            🎞 화질
        </button>

        <button id="resetSpeed">
            ↺ 속도 1×로 초기화
        </button>

        <button id="theater">
            ▣ 극장 모드
        </button>

        <button id="info">
            ℹ 영상 정보
        </button>

    </div>

</div>

<script>

const video = document.getElementById("video");
const player = document.getElementById("player");

const play = document.getElementById("play");
const back = document.getElementById("back");
const forward = document.getElementById("forward");

const mute = document.getElementById("mute");
const volume = document.getElementById("volume");

const progress = document.getElementById("progress");
const time = document.getElementById("time");

const speed = document.getElementById("speed");

const pip = document.getElementById("pip");
const fullscreen = document.getElementById("fullscreen");

const more = document.getElementById("more");
const menu = document.getElementById("menu");

const quality = document.getElementById("quality");
const resetSpeed = document.getElementById("resetSpeed");
const theater = document.getElementById("theater");
const info = document.getElementById("info");


function formatTime(sec){

    if(!isFinite(sec)) return "00:00";

    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);

    if(h > 0){
        return String(h).padStart(2,"0")
            + ":" +
            String(m).padStart(2,"0")
            + ":" +
            String(s).padStart(2,"0");
    }

    return String(m).padStart(2,"0")
        + ":" +
        String(s).padStart(2,"0");
}


function updatePlayButton(){

    play.textContent =
        video.paused ? "▶" : "⏸";
}


play.onclick = () => {

    if(video.paused)
        video.play();
    else
        video.pause();

};


video.addEventListener("play", updatePlayButton);
video.addEventListener("pause", updatePlayButton);


back.onclick = () => {

    video.currentTime =
        Math.max(0,video.currentTime - 10);

};


forward.onclick = () => {

    video.currentTime =
        Math.min(video.duration,
                 video.currentTime + 10);

};


mute.onclick = () => {

    video.muted = !video.muted;

    mute.textContent =
        video.muted ? "🔇" : "🔊";

};


volume.oninput = () => {

    video.volume = volume.value;

    video.muted = video.volume === 0;

    mute.textContent =
        video.muted ? "🔇" : "🔊";

};


speed.onchange = () => {

    video.playbackRate =
        Number(speed.value);

};


resetSpeed.onclick = () => {

    video.playbackRate = 1;
    speed.value = "1";

};


video.addEventListener("timeupdate", () => {

    if(video.duration){

        progress.value =
            (video.currentTime /
             video.duration) * 100;
    }

    time.textContent =
        formatTime(video.currentTime)
        + " / " +
        formatTime(video.duration);

});


progress.oninput = () => {

    if(video.duration){

        video.currentTime =
            (progress.value / 100)
            * video.duration;
    }

};


pip.onclick = async () => {

    try{

        if(document.pictureInPictureElement){

            await document.exitPictureInPicture();

        }else{

            await video.requestPictureInPicture();

        }

    }catch(e){

        alert(
            "이 브라우저에서는 PiP를 사용할 수 없습니다."
        );

    }

};


fullscreen.onclick = async () => {

    try{

        if(document.fullscreenElement){

            await document.exitFullscreen();

        }else{

            await player.requestFullscreen();

        }

    }catch(e){

        if(video.webkitEnterFullscreen)
            video.webkitEnterFullscreen();

    }

};


more.onclick = () => {

    menu.classList.toggle("show");

};


theater.onclick = () => {

    player.style.maxWidth =
        player.style.maxWidth === "none"
        ? "1100px"
        : "none";

};


quality.onclick = () => {

    alert(
        "현재 영상 파일은 MP4 하나이므로 실제 화질 선택은 사용할 수 없습니다.\n\n" +
        "여러 화질을 사용하려면 360p / 720p / 1080p 등의 별도 영상 파일이 필요합니다."
    );

};


info.onclick = () => {

    const width = video.videoWidth;
    const height = video.videoHeight;

    alert(
        "영상 정보\n\n" +
        "해상도: " +
        (width || "?") +
        " × " +
        (height || "?") +
        "\n길이: " +
        formatTime(video.duration)
    );

};


let hideTimer;

function showControls(){

    player.classList.remove("hide-controls");

    clearTimeout(hideTimer);

    if(!video.paused){

        hideTimer = setTimeout(() => {

            player.classList.add("hide-controls");

        },3000);

    }

}


player.addEventListener("mousemove",showControls);
player.addEventListener("touchstart",showControls);


video.addEventListener("click",() => {

    if(video.paused)
        video.play();
    else
        video.pause();

});


document.addEventListener("keydown",(e) => {

    if(e.target.tagName === "INPUT" ||
       e.target.tagName === "SELECT")
        return;

    if(e.code === "Space"){

        e.preventDefault();

        if(video.paused)
            video.play();
        else
            video.pause();
    }

    if(e.key === "ArrowLeft")
        video.currentTime -= 5;

    if(e.key === "ArrowRight")
        video.currentTime += 5;

    if(e.key === "ArrowUp"){

        e.preventDefault();

        video.volume =
            Math.min(1,video.volume + .1);

        volume.value = video.volume;
    }

    if(e.key === "ArrowDown"){

        e.preventDefault();

        video.volume =
            Math.max(0,video.volume - .1);

        volume.value = video.volume;
    }

    if(e.key === "f")
        fullscreen.click();

    if(e.key === "p")
        pip.click();

});


video.addEventListener("loadedmetadata",() => {

    time.textContent =
        "00:00 / " +
        formatTime(video.duration);

});


</script>

</body>
</html>
